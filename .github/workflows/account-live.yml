name: account-live

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sklavenitis-account-live
  cancel-in-progress: false

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKLAVENITIS_EMAIL: ${{ secrets.SKLAVENITIS_EMAIL }}
      SKLAVENITIS_PASSWORD: ${{ secrets.SKLAVENITIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Skip when credentials are absent
        if: env.SKLAVENITIS_EMAIL == '' || env.SKLAVENITIS_PASSWORD == ''
        run: echo "::warning::SKLAVENITIS_EMAIL/SKLAVENITIS_PASSWORD are not configured; skipping the account smoke."
      - name: Credential sanity
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: |
          python - <<'PY'
          import os
          email = os.environ["SKLAVENITIS_EMAIL"].strip().lower()
          public = {
              "info@sklavenitis.gr",
              "emarket@sklavenitis.gr",
              "905.customer.service@sklavenitis.gr",
          }
          print("email_is_known_public_contact=" + str(email in public))
          print("password_has_outer_whitespace="
                + str(os.environ["SKLAVENITIS_PASSWORD"] != os.environ["SKLAVENITIS_PASSWORD"].strip()))
          PY
      - name: Install Playwright for the reCAPTCHA token
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: python -m pip install playwright
      - name: Get a reCAPTCHA v3 token
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: python scripts/recaptcha_token.py >> "$GITHUB_ENV"
      - name: Browser login check
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: python scripts/browser_login_check.py
      - name: Login, search, cart, orders, logout
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: bash scripts/daily-smoke.sh
