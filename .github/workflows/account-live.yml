name: account-live

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sklavenitis-account-live
  cancel-in-progress: false

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKLAVENITIS_EMAIL: ${{ secrets.SKLAVENITIS_EMAIL }}
      SKLAVENITIS_PASSWORD: ${{ secrets.SKLAVENITIS_PASSWORD }}
      SKLAVENITIS_BROWSER_LOGIN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Skip when credentials are absent
        if: env.SKLAVENITIS_EMAIL == '' || env.SKLAVENITIS_PASSWORD == ''
        run: echo "::warning::SKLAVENITIS_EMAIL/SKLAVENITIS_PASSWORD are not configured; skipping the account smoke."
      - name: Install Playwright for the browser login
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: python -m pip install playwright
      - name: Browser login and export the session
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: |
          SESSION_DIR="$RUNNER_TEMP/sklavenitis-session"
          mkdir -p "$SESSION_DIR"
          export SKLAVENITIS_CONFIG_DIR="$SESSION_DIR"
          echo "SKLAVENITIS_CONFIG_DIR=$SESSION_DIR" >> "$GITHUB_ENV"
          python scripts/browser_login.py
      - name: Account probe
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: |
          python - <<'PY'
          from sklavenitis_cli.api import Api
          api = Api()
          base = "https://www.sklavenitis.gr"
          for i in range(2):
              r = api.session.get(base + "/account/", headers={"Referer": base + "/"})
              print("probe" + str(i) + "_status=" + str(r.status)
                    + " cookies=" + str(len(list(api.session.jar))))
          PY
      - name: Auth status probe
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: |
          which sklavenitis
          sklavenitis --version
          echo '--- console'
          sklavenitis auth status --json || true
          echo '--- module'
          python -m sklavenitis_cli.cli auth status --json || true
          echo '--- direct'
          python - <<'PY'
          from sklavenitis_cli.api import Api
          api = Api()
          print("is_logged_in=" + str(api.is_logged_in()))
          r = api.session.get("https://www.sklavenitis.gr/account/",
                              headers={"Referer": "https://www.sklavenitis.gr/"})
          final = (r.url or "").split("?", 1)[0]
          print("status=" + str(r.status))
          print("ok_path=" + str(final.endswith("/account/")))
          print("signin_path=" + str("/account/signin" in final))
          PY
      - name: Login, search, cart, orders, logout
        if: env.SKLAVENITIS_EMAIL != '' && env.SKLAVENITIS_PASSWORD != ''
        run: bash scripts/daily-smoke.sh
