name: live

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m live
        env:
          SKLAVENITIS_LIVE: "1"
