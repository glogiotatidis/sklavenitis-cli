name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: curl and urllib reachability
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64; rv:161.0) Gecko/20100101 Firefox/161.0'
          for url in \
            'https://www.sklavenitis.gr/' \
            'https://www.sklavenitis.gr/apotelesmata-anazitisis/?Query=gala'
          do
            printf 'curl %s -> ' "$url"
            curl -sS -o /tmp/body -w '%{http_code}\n' -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: el-GR,el;q=0.9,en;q=0.8' "$url" || true
            head -c 160 /tmp/body | tr '\n' ' '; echo
          done
          python3 - "$UA" <<'PY'
          import sys, urllib.request
          ua = sys.argv[1]
          for url in (
              'https://www.sklavenitis.gr/',
              'https://www.sklavenitis.gr/apotelesmata-anazitisis/?Query=gala',
          ):
              req = urllib.request.Request(url, headers={
                  'User-Agent': ua,
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'el-GR,el;q=0.9,en;q=0.8',
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print('urllib', url, '->', r.status)
              except Exception as exc:
                  print('urllib', url, '->', type(exc).__name__, getattr(exc, 'code', ''))
          PY
