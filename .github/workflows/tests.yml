name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 (ubuntu-latest) has no prebuilt Python 3.9 yet.
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: sklavenitis --version
      - run: sklavenitis --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: bash -n scripts/daily-smoke.sh
      - run: python -m compileall -q scripts
      - name: install the wheel in a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/sklavenitis --version
